<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#110f0d"><meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Reveal Quest · The Missing Itinerary</title>
<style>
:root{color-scheme:dark;--gold:#f5d28d;--old:#b88845;--ink:#11100d;--cream:#f7e9c8;--line:rgba(245,210,141,.30)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:#100e0c;color:var(--cream)}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #ffd77b;outline-offset:3px}a{color:var(--gold)}[hidden]{display:none!important}
#app{min-height:100svh}#ambient{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:.45;overflow:hidden}
#ambient i{position:absolute;bottom:-4%;width:2px;height:2px;border-radius:50%;background:#efd8a3;box-shadow:0 0 12px 2px #f2bd69;animation:drift var(--d,12s) linear infinite;left:var(--x,40%);animation-delay:var(--delay,0s)}
@keyframes drift{from{transform:translate(0,0);opacity:0}15%{opacity:.7}85%{opacity:.6}to{transform:translate(30px,-110vh);opacity:0}}
.quest{position:relative;isolation:isolate;min-height:100svh;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:flex;flex-direction:column}
.scene{position:absolute;z-index:-2;inset:0;transform:scale(1.055);animation:camera 24s ease-in-out infinite alternate;background-position:center;background-size:cover;background-color:#221a15}
.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,8,.37) 0%,rgba(8,8,8,.05) 24%,rgba(8,8,8,.11) 43%,rgba(8,8,8,.78) 78%,#0b0b0a 100%)}
.scene.letter{background-image:url('/quest-assets/letter.webp'),radial-gradient(at 45% 42%,#8d6238,#24130d 72%)}
.scene.suitcase{background-image:url('/quest-assets/suitcase.webp'),radial-gradient(at 49% 32%,#9a5a2c,#28160c 74%)}
.scene.passport{background-image:url('/quest-assets/passport.webp'),radial-gradient(at 50% 36%,#b8844e,#272118 79%)}
.scene.map{background-image:url('/quest-assets/map.webp'),radial-gradient(at 50% 32%,#6b583e,#171d1a 80%)}
.scene.ticket{background-image:url('/quest-assets/ticket.webp'),radial-gradient(at 50% 33%,#976e3e,#1d1710 76%)}
.scene.finale{background-image:url('/quest-assets/finale.webp'),radial-gradient(at 50% 25%,#b06f36,#251624 78%)}
@keyframes camera{0%{transform:scale(1.045) translateY(0)}100%{transform:scale(1.13) translateY(-1.3%)}}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 10px;background:linear-gradient(180deg,rgba(0,0,0,.54),transparent)}
.brand{letter-spacing:.29em;font-size:clamp(10px,3vw,12px);font-weight:700;color:#eccc8f;text-transform:uppercase;text-shadow:0 2px 6px #000}
.minibtn{border:1px solid var(--line);color:var(--gold);background:rgba(0,0,0,.4);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-size:15px}
.progress{display:flex;justify-content:center;gap:10px;padding:7px 10px}
.progress span{display:block;width:9px;height:9px;border:1px solid #c9a263;border-radius:50%;background:rgba(2,2,2,.7);box-shadow:0 0 0 1px rgba(10,8,5,.4)}
.progress span.active{background:var(--gold);box-shadow:0 0 12px #ffc976}
.eyebrow{text-transform:uppercase;letter-spacing:.29em;font-size:11px;color:#e2bd83;text-shadow:0 2px 8px black;font-weight:600}
.serif{font-family:Georgia,"Times New Roman",serif;font-weight:400;line-height:1.05}
h1,h2,p{margin-top:0}h1{font-size:clamp(36px,9vw,66px);letter-spacing:.02em;color:#f4d49a;text-shadow:0 3px 15px #000,0 0 38px #6b411c}h2{font-size:clamp(31px,7vw,46px);color:#f4d49a;text-shadow:0 3px 18px #000}
.ornament{display:flex;justify-content:center;align-items:center;gap:16px;color:var(--gold)}.ornament:before,.ornament:after{content:"";height:1px;max-width:65px;flex:1;background:linear-gradient(90deg,transparent,var(--gold))}
.stage-body{flex:1;width:100%;max-width:700px;margin:0 auto;display:flex;flex-direction:column;justify-content:end;align-items:center;text-align:center;padding:12px 20px 30px;gap:12px}
.stage-copy{max-width:570px;color:#fff1d9;font-size:clamp(15px,3.7vw,18px);line-height:1.55;text-shadow:0 2px 9px #000}
.stage-card{width:100%;padding:22px 16px 18px;border:1px solid rgba(242,193,111,.33);border-radius:18px;background:linear-gradient(145deg,rgba(28,22,18,.91),rgba(7,8,8,.88));box-shadow:0 25px 65px rgba(0,0,0,.55),inset 0 1px rgba(255,230,175,.11);backdrop-filter:blur(12px)}
.stage-card p{line-height:1.5}
.btn{display:inline-flex;justify-content:center;align-items:center;min-height:51px;border-radius:13px;border:1px solid #c8a16b;padding:12px 21px;color:#21140b;background:linear-gradient(125deg,#fce4a8,#b98030 68%,#d8a64e);font-weight:700;box-shadow:inset 0 1px rgba(255,255,255,.5),0 6px 24px #0008}
.btn:disabled{opacity:.42;cursor:not-allowed}.btn.secondary{background:#181612b8;color:#efd7a5;box-shadow:none}.btn.ghost{border:none;color:#efd7a5;background:transparent;box-shadow:none}
.actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:9px;margin-top:12px}
.answer-grid{display:grid;gap:9px;margin:15px 0 5px}
.answer-grid button,.sortable button{color:#f8e3bb;border:1px solid rgba(239,193,105,.55);border-radius:12px;min-height:53px;background:linear-gradient(110deg,rgba(43,32,19,.92),rgba(11,11,10,.86));box-shadow:inset 0 1px rgba(255,225,174,.12);font-size:16px}
.answer-grid button:hover,.sortable button:hover{border-color:#ffdc93}
.answer-grid button.selected,.sortable button.selected{background:linear-gradient(130deg,#764f24,#392911);border-color:#ffd985;box-shadow:0 0 16px #c58b393d;color:#fff5d8}
.wheels{display:flex;justify-content:center;gap:9px;margin:18px 0}
.wheel{min-width:66px;max-width:80px;width:25%;padding:4px;background:linear-gradient(#ba8a45,#77511f,#d1a85a);border:2px solid #d9b476;border-radius:12px;box-shadow:0 3px 17px #000a,inset 0 1px #fff5}
.wheel button{background:none;border:0;display:block;width:100%;font-size:24px;color:#160e08;min-height:35px}
.wheel output{display:block;color:#160e08;font:39px/1.5 Georgia,serif;background:#e6cb94;border-radius:4px;box-shadow:inset 0 3px 8px #0005}
.sequence{display:flex;justify-content:center;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0;min-height:36px}
.sequence span{font-size:13px;border:1px solid #d9ac65;color:#ffe6ae;padding:7px 9px;border-radius:5px;background:#311f0f}
.sortable{display:grid;gap:8px;margin-top:14px}
.hint{margin:12px 0 0;padding:15px;border:1px solid var(--line);border-radius:12px;background:#372617d9;text-align:left;line-height:1.5;font-size:14px}
.error{color:#ffbdab;min-height:20px;font-size:14px}
.success{position:fixed;inset:0;background:radial-gradient(circle,#ffd57d90,rgba(17,12,10,.95) 55%);z-index:10;display:grid;place-items:center;text-align:center;animation:appear .5s ease-out}.success div{color:#ffe6ad;font:clamp(28px,8vw,54px) Georgia,serif;text-shadow:0 0 28px gold}
@keyframes appear{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.finale-content{margin:auto auto 9vh;width:min(720px,94%);text-align:center;padding:32px 16px;background:radial-gradient(ellipse,rgba(16,10,9,.6),transparent 80%)}
.finale-content h1{font-size:clamp(42px,10vw,85px)}.final-image{width:min(420px,85%);max-height:35vh;object-fit:contain;border:1px solid var(--line);border-radius:14px;margin:14px auto}.reveal-details{font-size:15px;line-height:1.7;color:#ffe5b8;text-shadow:0 2px 9px #000}
#create{min-height:100svh;background:linear-gradient(rgba(8,7,6,.72),#120f0c 650px),url('/quest-assets/letter.webp') center top/auto 850px no-repeat,#160f0b}
.create-inner{max-width:940px;margin:auto;padding:26px 17px 80px}
.create-intro{max-width:680px;margin:80px auto 45px;text-align:center}.create-intro p{line-height:1.65;color:#e6d3b5}
.creator-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{padding:22px 21px;border:1px solid var(--line);border-radius:18px;background:rgba(16,14,12,.92);backdrop-filter:blur(12px);box-shadow:0 18px 50px #0007}
.panel h2{font-size:30px}.panel label{display:block;font-size:13px;font-weight:650;color:#e8c88f;margin:14px 0 5px}
.panel input,.panel select,.panel textarea{width:100%;max-width:100%;padding:12px 13px;border-radius:9px;color:#fff6df;background:#211b16;border:1px solid #725b39;font-size:16px}
.panel textarea{min-height:78px;resize:vertical}.panel small{color:#c8b496;line-height:1.5}
.panel .stepedit{padding:10px 0 17px;border-bottom:1px solid var(--line)}
.panel .stepedit h3{font:21px Georgia,serif;color:#f3d396;margin:13px 0 7px}
.preview{background:linear-gradient(180deg,transparent,rgba(0,0,0,.86)),url('/quest-assets/letter.webp') center/cover;min-height:325px;border:1px solid #b58f59;border-radius:15px;padding:24px 15px;display:flex;flex-direction:column;justify-content:end;text-align:center}
.preview h3{font:31px Georgia,serif;color:#fae0a1;margin:0 0 10px;text-shadow:0 2px 7px black}.preview p{line-height:1.5;color:#fff2d9}
.review-note{padding:14px;border-radius:10px;background:#29231b;color:#f3d7a8;font-size:13px;line-height:1.5}
@media(max-width:690px){.creator-grid{grid-template-columns:1fr}.stage-body{padding:14px 14px 25px}.stage-card{padding:16px 14px}.create-intro{margin:50px auto 28px}.scene.suitcase{background-position:center 44%}.scene.letter{background-position:center 37%}}
@media(min-width:800px){.stage-body{padding-bottom:6vh}.stage-card{max-width:575px}.quest .scene{background-position:center 48%}}

/* Cinematic final-stage transition. All visual content is still gated on the Worker. */
.quest.played .scene.finale{animation:questFinalCamera 3.2s cubic-bezier(.16,.74,.24,1) both}
.quest.played .finale-content{animation:questFinalText 2.2s cubic-bezier(.2,.65,.2,1) both}
.quest.played:before{content:"";pointer-events:none;position:absolute;inset:0;z-index:-1;
 background:radial-gradient(circle at 50% 37%,rgba(255,240,184,.78),rgba(237,176,74,.33) 17%,transparent 45%),
 repeating-conic-gradient(from 20deg at 50% 36%,transparent 0deg 12deg,rgba(255,214,119,.08) 13deg 15deg,transparent 16deg 28deg);
 animation:questFinalBurst 2.8s ease-out both}
@keyframes questFinalCamera{0%{transform:scale(1.35) translateY(5%);filter:brightness(2.0) blur(6px)}45%{filter:brightness(1.2) blur(0)}100%{transform:scale(1.055) translateY(0);filter:brightness(1)}}
@keyframes questFinalText{0%,22%{opacity:0;transform:translateY(24px) scale(.92);filter:blur(6px)}90%,100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes questFinalBurst{0%{opacity:0;transform:scale(.25)}13%{opacity:1}55%{opacity:.62}100%{opacity:0;transform:scale(1.8)}}
@media print{.topline,.actions,#ambient,.progress{display:none!important}.scene{opacity:.25}.finale-content{color:black}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition:none!important;scroll-behavior:auto!important}}

/* Actual stage artwork remains visible during puzzle play rather than being
   hidden behind the controls. Portrait crops frame the hero object on phones. */
.hero-object{
  position:relative;isolation:isolate;flex:none;width:100%;max-width:620px;
  height:clamp(190px,29svh,315px);overflow:hidden;border-radius:18px;
  border:1px solid rgba(252,219,165,.30);
  box-shadow:0 20px 44px rgba(0,0,0,.68),inset 0 1px rgba(255,233,187,.24);
  background-position:center 58%;background-size:cover;background-repeat:no-repeat;
  animation:hero-arrival .9s cubic-bezier(.19,1,.22,1) both;
}
.hero-object:before{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(1,1,1,.03) 45%,rgba(15,9,6,.32) 100%);
  pointer-events:none}
.hero-object:after{content:"";position:absolute;inset:-35% -110%;
  background:linear-gradient(110deg,transparent 41%,rgba(255,216,145,.08) 50%,transparent 59%);
  animation:hero-glint 12s linear infinite;pointer-events:none}
.hero-object.letter{background-image:url('/quest-assets/letter.webp');background-position:center 61%}
.hero-object.suitcase{background-image:url('/quest-assets/suitcase.webp');background-position:center 62%}
.hero-object.passport{background-image:url('/quest-assets/passport.webp');background-position:center 67%}
.hero-object.map{background-image:url('/quest-assets/map.webp');background-position:center 66%}
.hero-object.ticket{background-image:url('/quest-assets/ticket.webp');background-position:center 65%}
@keyframes hero-arrival{from{opacity:.12;transform:perspective(800px) translateY(24px) rotateX(5deg) scale(.98);filter:brightness(.55)}
 to{opacity:1;transform:perspective(800px) translateY(0) rotateX(0) scale(1);filter:brightness(1)}}
@keyframes hero-glint{from{transform:translateX(-48%)}to{transform:translateX(48%)}}
.stage-body:has(.hero-object){justify-content:flex-start;padding-top:18px}
.stage-body:has(.hero-object) h2{margin-bottom:5px!important}
.stage-body:has(.hero-object) .stage-card{margin-top:3px}
@media(min-width:800px){.hero-object{height:clamp(230px,37vh,390px)}}


/* Scene-specific payoff: the object changes state and the camera pushes in. */
.quest.chapter-clear .stage-card{transition:opacity .65s ease,transform .65s ease;opacity:0;transform:translateY(18px)}
.quest.chapter-clear .hero-object{animation:hero-unlock 1.15s cubic-bezier(.21,.8,.25,1) forwards}
.quest.chapter-clear .hero-object.letter{animation:letter-open 1.15s ease-in forwards}
.quest.chapter-clear .hero-object.suitcase{animation:case-unlock 1.15s ease-in forwards}
.quest.chapter-clear .hero-object.map{animation:map-unfold 1.15s ease-in forwards}
@keyframes hero-unlock{0%{filter:brightness(1);transform:scale(1)}
 45%{filter:brightness(1.55);transform:scale(1.035)}
 100%{filter:brightness(2.1) blur(4px);transform:scale(1.17)}}
@keyframes letter-open{0%{transform:perspective(700px) rotateX(0) scale(1);filter:brightness(1)}
 55%{transform:perspective(700px) rotateX(9deg) scale(1.06);filter:brightness(1.5)}
 100%{transform:perspective(700px) rotateX(17deg) scale(1.2);filter:brightness(2) blur(4px)}}
@keyframes case-unlock{0%{transform:scale(1) rotateZ(0);filter:brightness(1)}
 40%{transform:scale(1.035) rotateZ(-1deg);filter:brightness(1.2)}
 100%{transform:scale(1.2) rotateZ(1deg);filter:brightness(2) blur(3px)}}
@keyframes map-unfold{0%{transform:perspective(700px) rotateX(0) scale(1);filter:brightness(1)}
 70%{transform:perspective(700px) rotateX(-5deg) scale(1.1);filter:brightness(1.9)}
 100%{transform:perspective(700px) rotateX(0) scale(1.18);filter:brightness(2.2) blur(3px)}}
.success{background:radial-gradient(circle,#f1b55c8a,rgba(13,8,5,.90) 63%)!important}
.success .chapter-animation{display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:30px;text-align:center;animation:chapter-focus 1s cubic-bezier(.16,1,.3,1) both}
.success .chapter-glyph{display:block;font:normal clamp(75px,19vw,130px)/1 Georgia,serif;
  color:#ffdfa2;text-shadow:0 0 10px #fff0bf,0 0 38px #e4ab5b,0 0 105px #ae5e1e;
  animation:chapter-icon 1.1s cubic-bezier(.25,.8,.25,1) both}
.success .chapter-message{display:block;font:normal clamp(24px,6vw,39px)/1.15 Georgia,serif;
  color:#ffebc0;text-shadow:0 3px 25px #130c07}
@keyframes chapter-focus{from{opacity:0;transform:translateY(26px) scale(.8)}
 to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes chapter-icon{0%{transform:scale(.55) rotate(-12deg);opacity:0}
 45%{transform:scale(1.2) rotate(4deg);opacity:1}
 100%{transform:scale(1) rotate(0);opacity:1}}
/* The replay button must trigger a real visual sequence, not merely a sound. */
.quest.played .scene.finale{animation:finale-camera 7s cubic-bezier(.2,.7,.3,1) both}
.quest.played .finale-content{animation:finale-appear 1.8s cubic-bezier(.19,1,.22,1) both}
.quest.played .finale-content::before{content:"✦";display:block;font:64px Georgia,serif;
  color:#ffe2a3;text-shadow:0 0 20px #fff,0 0 80px #ffb548;
  animation:finale-flare 2.5s ease-out both}
@keyframes finale-camera{from{transform:scale(1.18);filter:brightness(1.4)}
 to{transform:scale(1.03);filter:brightness(1)}}
@keyframes finale-appear{0%{opacity:0;transform:translateY(36px) scale(.92)}
 45%{opacity:0;transform:translateY(16px) scale(.97)}
 100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes finale-flare{0%{opacity:0;transform:scale(.5)}
 40%{opacity:1;transform:scale(1.35)}
 100%{opacity:.8;transform:scale(1)}}


/* In-world controls: the actual suitcase wheels, stamped documents, map
   landmarks and ticket fragments are touched inside the cinematic object. */
.hero-object{overflow:visible}
.hero-object.suitcase{overflow:hidden}
.hero-object.suitcase .wheels{position:absolute;z-index:4;bottom:8px;left:50%;
  transform:translateX(-50%);margin:0;display:flex;gap:6px;justify-content:center;
  padding:5px 8px;border:1px solid #d7ae65b3;border-radius:14px;
  background:linear-gradient(125deg,#201508cc,#594124b3,#17120de6);backdrop-filter:blur(8px);
  box-shadow:0 9px 29px #000c,inset 0 1px #fff4;width:min(290px,95%);
}
.hero-object.suitcase .wheel{min-width:55px;width:27%;max-width:76px;padding:1px;border-radius:8px;box-shadow:0 3px 10px #0009}
.hero-object.suitcase .wheel button{min-height:28px;font-size:22px}
.hero-object.suitcase .wheel output{font-size:31px;line-height:1.3}
.hero-object .sortable{position:absolute;z-index:4;bottom:8px;left:50%;
  transform:translateX(-50%);margin:0;display:flex;justify-content:center;
  flex-wrap:wrap;align-items:stretch;gap:5px;width:calc(100% - 14px);
}
.hero-object .sortable button{flex:1;min-width:0;padding:8px 4px;
  min-height:49px;font-size:clamp(10px,2.75vw,13px);
  background:linear-gradient(160deg,#4a3119ee,#17120ce8);color:#fff1ce;
  border:1px solid #e1bb7ebd;border-radius:9px;
  box-shadow:0 4px 14px #000c,0 0 12px #e7b97221;backdrop-filter:blur(4px)
}
.hero-object.passport .sortable button{border-radius:50% 12% 49% 15%;transform:rotate(-2deg)}
.hero-object.map .sortable button{border-radius:50px;background:linear-gradient(#3b2a19ed,#14150ff0)}
.hero-object.ticket .sortable button{border-radius:2px;background:linear-gradient(#624c31ef,#241811ef)}
.hero-object.passport .sortable button.selected,.hero-object.map .sortable button.selected,
.hero-object.ticket .sortable button.selected{background:linear-gradient(#a1783c,#4c3119);box-shadow:0 0 16px #e1bc68bb}
@media(max-width:400px){.hero-object.suitcase .wheels{bottom:4px}.hero-object .sortable button{font-size:11px}}


/* Object-specific cinematography: layers physically react to a solved clue. */
.hero-object .case-lid{position:absolute;z-index:2;inset:10% 12% 48%;
  background:url('/quest-assets/suitcase.webp') center 42%/cover no-repeat;
  border:1px solid rgba(222,172,94,.5);border-radius:13px 13px 7px 7px;
  box-shadow:inset 0 3px 25px #0007,0 0 32px #0009;
  transform-origin:50% 0;opacity:0;pointer-events:none}
.quest.chapter-clear .case-lid{animation:suitcase-lid-opening 1.18s cubic-bezier(.12,.8,.2,1) both}
@keyframes suitcase-lid-opening{
  0%{opacity:.95;transform:perspective(480px) rotateX(0) translateY(0)}
  45%{opacity:1;transform:perspective(480px) rotateX(-44deg) translateY(-9px);
    box-shadow:0 0 32px #ffd78d9c}
  100%{opacity:0;transform:perspective(480px) rotateX(-85deg) translateY(-35px);
    box-shadow:0 0 90px #ffe2a0}
}
.hero-object .seal-flare{position:absolute;z-index:2;left:48%;top:33%;width:70px;height:70px;
  border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,#fff2bd 2%,#ffc269 18%,#b63d22 38%,transparent 69%);
  box-shadow:0 0 24px #ffc26b,0 0 45px #a53215}
.quest.chapter-clear .seal-flare{animation:wax-break 1.12s ease-out both}
@keyframes wax-break{0%{opacity:.85;transform:scale(.5) rotate(0deg)}
  35%{opacity:1;transform:scale(1.1) rotate(18deg)}
  100%{opacity:0;transform:scale(5) rotate(65deg)}}
.hero-object .passport-page-turn{position:absolute;z-index:2;inset:6% 11% 9% 46%;
  pointer-events:none;opacity:0;transform-origin:left center;
  background:linear-gradient(90deg,#eee0c3 0%,#c3a173 8%,#ecd5ac 40%,#fff0d5 85%,#9d7143 100%);
  border-radius:5px 13px 13px 5px;box-shadow:0 7px 20px #0009}
.quest.chapter-clear .passport-page-turn{animation:passport-flip 1.15s cubic-bezier(.4,.4,.6,1) both}
@keyframes passport-flip{
  0%{opacity:.98;transform:perspective(700px) rotateY(0)}
  55%{opacity:1;transform:perspective(700px) rotateY(-90deg)}
  100%{opacity:0;transform:perspective(700px) rotateY(-178deg)}}
.map-journey{position:absolute;z-index:2;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.map-journey path{fill:none;stroke:#fff6bb;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1100;stroke-dashoffset:1100;filter:drop-shadow(0 0 12px #ffd44f);
  opacity:0}
.quest.chapter-clear .map-journey path{animation:draw-golden-route 1.15s ease-out forwards}
@keyframes draw-golden-route{0%{opacity:0;stroke-dashoffset:1100}
  15%{opacity:1}100%{opacity:1;stroke-dashoffset:0}}
.hero-object .ticket-light{position:absolute;z-index:2;inset:6%;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at 50% 48%,#fff7d1 0%,#ffd17b9c 24%,#b37b3b38 51%,transparent 75%);
  mix-blend-mode:screen}
.quest.chapter-clear .ticket-light{animation:ticket-illuminated 1.2s ease-out forwards}
@keyframes ticket-illuminated{0%{opacity:0;transform:scale(.5)}

.finale-sky{position:absolute;z-index:0;inset:0;overflow:hidden;pointer-events:none}
.finale-spark{position:absolute;left:var(--x,50%);top:var(--y,40%);
  display:block;width:var(--diameter,4px);height:var(--diameter,4px);
  border-radius:50%;opacity:0;background:#fff5c9;
  box-shadow:0 0 13px 5px #ffcc7c99,0 0 45px 14px #ffc97155;
  animation:cinematic-gold-star 4s ease-in-out var(--delay,0s) infinite}
@keyframes cinematic-gold-star{
  0%,100%{opacity:0;transform:translateY(25px) scale(.2)}

.finale-content{position:relative;z-index:1}

 .quest.chapter-clear .case-lid,.quest.chapter-clear .seal-flare,
 .quest.chapter-clear .passport-page-turn{opacity:0}
 .quest.chapter-clear .map-journey path{stroke-dashoffset:0;opacity:1}
 .finale-spark{display:none}
}
