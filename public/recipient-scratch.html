<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#10111C">
<title>A special surprise</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;background:
    radial-gradient(circle at 15% 10%,#a57f3a2b,transparent 32%),
    radial-gradient(circle at 85% 85%,#7962ca2a,transparent 35%),
    #10111c;color:#fcf5e6;font:16px/1.6 system-ui,-apple-system,sans-serif}
  main{max-width:490px;margin:0 auto;padding:clamp(20px,5vw,38px) 18px 70px;text-align:center}
  .eyebrow{color:#e7cb88;letter-spacing:.2em;text-transform:uppercase;font-size:.7rem;font-weight:750}
  h1{font:normal clamp(2rem,9vw,3.2rem)/1.09 Georgia,serif;letter-spacing:-.035em;margin:15px 0 10px}
  .intro{color:#ded1ba;font-size:.9rem;line-height:1.6;margin:0 auto 22px;max-width:350px}
  .error{background:#56303a;color:#fff;border:1px solid #af6872;padding:16px;border-radius:12px;margin:20px 0}
  .card{position:relative;width:100%;min-height:min(128vw,620px);border:4px solid #cda45b;border-radius:24px;
    overflow:hidden;background:#181527;box-shadow:0 25px 60px #0009;isolation:isolate}
  .card[hidden]{display:none!important}
  .ticket-underlay{visibility:hidden;width:100%;min-height:min(128vw,620px);display:flex;flex-direction:column;
    justify-content:space-between;align-items:center;gap:15px;padding:clamp(16px,5vw,26px);
    background:radial-gradient(ellipse at 50% 14%,#58426e,transparent 55%),
    linear-gradient(135deg,#11182e,#2a1a3d 60%,#10182b)}
  .card.foil-ready .ticket-underlay{visibility:visible}
  .label{color:#eed294;font-size:.62rem;letter-spacing:.17em;font-weight:750}
  .recipient{font:normal clamp(2rem,8vw,3rem)/1.05 Georgia,serif;margin:9px 0 4px;overflow-wrap:anywhere}
  .headline{font:normal clamp(1.55rem,6vw,2.3rem)/1.1 Georgia,serif;overflow-wrap:anywhere;max-width:100%;margin:0}
  .ticket{width:100%;color:#372719;background:linear-gradient(135deg,#f4e2bb,#fff9e7,#e8cda0);
    border-radius:13px;text-align:left;padding:19px 17px;box-shadow:0 14px 36px #0006}
  .ticket .kicker{font-size:.6rem;color:#977035;letter-spacing:.13em;font-weight:750}
  .ticket h2{font:normal clamp(1.4rem,6vw,2rem)/1.1 Georgia,serif;margin:8px 0 14px;overflow-wrap:anywhere}
  .ticket-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;border-top:2px dashed #c1a77d;padding-top:13px}
  .ticket-item{min-width:0}
  .ticket-item dt{font-size:.56rem;letter-spacing:.14em;color:#957242;font-weight:800;margin:0 0 3px}
  .ticket-item dd{margin:0;font-size:.78rem;font-weight:650;overflow-wrap:anywhere}
  .message{font:italic .88rem/1.45 Georgia,serif;color:#f1ddbc;overflow-wrap:anywhere;white-space:pre-wrap;margin:0}
  .field-grid[hidden],.ticket-item[hidden],.event-image-wrap[hidden],.booking-row[hidden],
  .message-wrap[hidden],.sender-wrap[hidden],#bookingAction[hidden]{display:none!important}
  .event-image-wrap{width:100%;margin:3px auto 0;min-height:0}
  .event-image-wrap img{display:block;width:100%;max-height:185px;object-fit:contain;border-radius:11px}
  .booking-row{margin-top:11px;border-top:2px dashed #c1a77d;padding-top:11px}
  .booking-row dt{font-size:.58rem;letter-spacing:.14em;color:#957242;font-weight:800}
  .booking-row dd{margin:4px 0 0;font-size:.76rem;overflow-wrap:anywhere;word-break:break-word}
  .booking-row a{color:#4f3572;text-underline-offset:3px}
  #bookingAction{display:inline-block;margin:12px auto 0;padding:11px 16px;min-height:44px;border:1px solid #d7b86f;
    border-radius:99px;color:#fae8c3;text-decoration:none;font-weight:650;overflow-wrap:anywhere}
  #bookingAction:focus-visible{outline:3px solid #fff;outline-offset:3px}
  #foilCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  .status{min-height:29px;margin-top:14px;color:#e8d8b8;font-size:.84rem}
  progress{display:block;width:100%;height:8px;border-radius:99px;margin:9px 0 20px;accent-color:#d6b375}
  .buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
  button{padding:11px 16px;min-height:44px;border-radius:99px;border:1px solid #d7b86f;background:transparent;color:#fae8c3;
    font:650 .9rem system-ui;cursor:pointer}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}
  footer{margin:24px auto 0;color:#afa6a9;font-size:.74rem}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Something special just for you</div>
  <h1 id="title">Your surprise awaits</h1>
  <p class="intro" id="intro">Preparing your personal scratch card…</p>
  <div id="error" class="error" hidden role="alert"></div>
  <div id="card" class="card" hidden>
    <div id="underlay" class="ticket-underlay">
      <div><div class="label">A SURPRISE FOR</div><h2 class="recipient" id="name"></h2><div class="label">YOU ARE INVITED TO…</div></div>
      <h3 class="headline" id="headline">A special surprise</h3>
      <article class="ticket">
        <div class="kicker">PERSONALISED EVENT TICKET</div>
        <h2 id="eventName"></h2>
        <div id="eventImageWrap" class="event-image-wrap" hidden>
          <img id="eventImage" alt="Personal image included with this surprise">
        </div>
        <dl class="ticket-grid field-grid" id="ticketGrid" hidden>
          <div class="ticket-item" id="dateRow" hidden><dt>DATE</dt><dd id="date"></dd></div>
          <div class="ticket-item" id="timeRow" hidden><dt>TIME</dt><dd id="time"></dd></div>
          <div class="ticket-item" id="venueRow" hidden><dt>VENUE</dt><dd id="venue"></dd></div>
          <div class="ticket-item" id="admitRow" hidden><dt>ADMIT</dt><dd id="admit"></dd></div>
        </dl>
        <dl class="booking-row" id="bookingRow" hidden>
          <dt>OFFICIAL TICKET OR BOOKING LINK</dt>
          <dd><a id="bookingUrl" rel="noopener noreferrer nofollow" referrerpolicy="no-referrer"
            target="_blank"></a></dd>
        </dl>
      </article>
      <div>
        <div class="message-wrap" id="messageWrap" hidden><p class="message" id="message"></p></div>
        <div class="sender-wrap" id="senderWrap" hidden><div class="label" id="sender"></div></div>
      </div>
    </div>
    <canvas id="foilCanvas" aria-label="Scratch to uncover your surprise"></canvas>
  </div>
  <p class="status" id="status" aria-live="polite"></p>
  <progress id="progress" value="0" max="100" aria-label="Scratch progress" hidden></progress>
  <a id="bookingAction" rel="noopener noreferrer nofollow" referrerpolicy="no-referrer"
    target="_blank" hidden>Open your booking link</a>
  <div id="controls" class="buttons" hidden>
    <button id="soundButton" type="button" aria-pressed="true">♫ Sound on</button>
    <button id="replayButton" type="button">↻ Scratch again</button>
  </div>
  <footer id="footer"></footer>
</main>
<script type="module">
  import { ScratchCard } from '/scratchcard.js?v=surface-design-v2';
  import { ScratchCinematicAudio } from '/scratch-audio.js?v=first-scratch-v1';
  import { recipientCardModel } from '/scratch-recipient-fields.js?v=complete-card-1';
  const $ = id => document.getElementById(id);
  const slug = location.pathname.split('/').filter(Boolean)[1];
  const status = $('status');
  let scratch = null;
  let cinematic = null;
  let soundEnabled = true;
  const text = (id,value) => { $(id).textContent = value ?? ''; };
  let bookingLink = '';
  function applyDetails(model) {
    for (const id of ['date','time','venue','admit']) {
      const item = model.details.find(detail => detail.id === id);
      $(id + 'Row').hidden = !item;
      text(id,item?.value || '');
    }
    $('ticketGrid').hidden = model.details.length === 0;
    $('messageWrap').hidden = !model.message;
    text('message',model.message);
    $('senderWrap').hidden = !model.sender;
    text('sender',model.sender ? 'With love, from ' + model.sender : '');
    bookingLink = model.ticketUrl;
    $('bookingRow').hidden = !bookingLink;
    if (bookingLink) {
      $('bookingUrl').textContent = bookingLink;
      $('bookingUrl').href = bookingLink;
      $('bookingAction').href = bookingLink;
    } else {
      $('bookingUrl').removeAttribute('href');
      $('bookingAction').removeAttribute('href');
    }
  }

  async function load() {
    if (!slug || !/^[A-Za-z0-9_-]+$/.test(slug)) throw new Error('Invalid reveal link.');
    const response = await fetch('/r/' + encodeURIComponent(slug) + '/scratch-data', {cache:'no-store'});
    if (!response.ok) throw new Error('This surprise is not yet available.');
    const data = await response.json();
    if (!data.success) throw new Error('This surprise is not available.');
    const model = recipientCardModel(data.reveal);
    soundEnabled = data.audio?.enabled !== false;
    text('title','A surprise for ' + model.recipient);
    text('name',model.recipient);
    text('eventName',model.eventName);
    text('headline','Your special surprise');
    applyDetails(model);
    if (model.hasEventImage) {
      const image = $('eventImage');
      const src = '/r/' + encodeURIComponent(slug) + '/scratch-image';
      await new Promise((resolve,reject) => {
        image.onload = resolve;
        image.onerror = () => reject(new Error('Your surprise image could not be loaded.'));
        image.src = src;
      });
      $('eventImageWrap').hidden = false;
    } else {
      $('eventImageWrap').hidden = true;
    }
    $('intro').textContent = 'Scratch the surface with your finger or mouse. Every piece of foil stays until you remove it.';
    $('card').hidden = false;

    cinematic = new ScratchCinematicAudio({
      enabled:soundEnabled,
      delayMs:3000,
      onCue:() => { status.textContent = 'The cinematic drum roll has begun. Keep scratching!'; }
    });
    scratch = new ScratchCard({
      canvas:$('foilCanvas'),
      foil:data.scratchSurface.foil,
      coverStyle:data.scratchSurface.style === 'custom' ? 'classic' : data.scratchSurface.style,
      brushSize:49,
      onScratch:() => cinematic.onFirstScratch(),
      onProgress:p => {
        $('progress').value = Math.round(p*100);
        // The link is also available below the finished card once the user
        // has substantially scratched it; Canvas overlays otherwise block taps.
        if (bookingLink && p >= 0.7) $('bookingAction').hidden = false;
      },
      onComplete:() => { status.textContent = 'You uncovered your surprise!'; }
    });

    if (data.scratchSurface.hasImage) {
      const applied = await scratch.setCoverImage('/r/' + encodeURIComponent(slug) + '/scratch-cover');
      if (!applied) throw new Error('Your custom scratch image could not be loaded.');
    }
    $('card').classList.add('foil-ready');
    $('progress').hidden = false;
    $('controls').hidden = false;
    $('soundButton').hidden = !soundEnabled;
    status.textContent = 'Scratch the card to discover your surprise.';
  }

  $('replayButton').addEventListener('click',() => {
    if (!scratch) return;
    cinematic.reset();
    scratch.reset();
    $('bookingAction').hidden = true;
    status.textContent = 'Scratch to begin again.';
  });
  $('soundButton').addEventListener('click',() => {
    if (!cinematic) return;
    soundEnabled = !soundEnabled;
    cinematic.setEnabled(soundEnabled);
    $('soundButton').setAttribute('aria-pressed',String(soundEnabled));
    $('soundButton').textContent = soundEnabled ? '♫ Sound on' : '♫ Sound off';
  });
  window.addEventListener('pagehide', () => {
    scratch?.destroy();
    cinematic?.destroy();
  });
  load().catch(error => {
    $('card').hidden = true;
    $('controls').hidden = true;
    $('progress').hidden = true;
    $('bookingAction').hidden = true;
    $('intro').textContent = 'We could not open this surprise.';
    $('error').hidden = false;
    $('error').textContent = error.message || 'Please try again later.';
  });
</script>
</body>
</html>
