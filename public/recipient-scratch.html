<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#10111C">
<title>A special surprise</title>
<link rel="stylesheet" href="/scratch-recipient-face.css?v=actual-1">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;background:
    radial-gradient(circle at 15% 10%,#a57f3a2b,transparent 32%),
    radial-gradient(circle at 85% 85%,#7962ca2a,transparent 35%),
    #10111c;color:#fcf5e6;font:16px/1.6 system-ui,-apple-system,sans-serif}
  .status{min-height:29px;margin-top:14px;color:#e8d8b8;font-size:.84rem}
  progress{display:block;width:100%;height:8px;border-radius:99px;margin:9px 0 20px;accent-color:#d6b375}
  .buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
  button{padding:11px 16px;min-height:44px;border-radius:99px;border:1px solid #d7b86f;background:transparent;color:#fae8c3;
    font:650 .9rem system-ui;cursor:pointer}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}
  footer{margin:24px auto 0;color:#afa6a9;font-size:.74rem}

  /* Concert variant only: wide admission ticket, dashed tear-off stub.
     Content may increase the height rather than hide supplied form values. */
  body[data-ticket-variant="concert"] main{max-width:970px}
  body[data-ticket-variant="concert"] .intro{max-width:580px}
  .card.concert-ticket{
    width:100%;min-height:clamp(190px,41vw,410px);border:3px solid #dab779;
    border-radius:11px;clip-path:polygon(0 0,26% 0,28% 4%,30% 0,100% 0,
      100% 100%,30% 100%,28% 96%,26% 100%,0 100%);
    box-shadow:0 24px 70px #0009;
  }
  .card.concert-ticket::after{
    content:"";position:absolute;z-index:2;pointer-events:none;
    top:0;bottom:0;left:73%;border-left:2px dashed #f1d293ab
  }
  .concert-ticket .ticket-underlay{
    min-height:clamp(190px,41vw,410px);width:100%;height:auto;
    display:grid;grid-template-columns:minmax(0,73%) minmax(0,27%);
    grid-template-rows:auto 1fr;gap:0;align-items:stretch;padding:0;
    background:linear-gradient(130deg,#24192e 0%,#502846 28%,#f9ebcd 28.1%,#f0d9a2 100%)
  }
  .concert-ticket .ticket-identity{
    grid-column:2;grid-row:1;padding:clamp(13px,2.2vw,24px) clamp(8px,2vw,20px) 6px;
    min-width:0;text-align:left;overflow-wrap:anywhere
  }
  .concert-ticket .ticket-identity .recipient{
    font:normal clamp(1rem,2.3vw,1.75rem)/1.12 Georgia,serif;overflow-wrap:anywhere
  }
  .concert-ticket .ticket-identity .label{font-size:clamp(.49rem,.9vw,.65rem)}
  .concert-ticket .headline{display:none}
  .concert-ticket .ticket{
    grid-column:1;grid-row:1 / 3;min-width:0;height:100%;
    border-radius:0;background:linear-gradient(135deg,#fff8e6,#f0d9a2);
    box-shadow:none;padding:clamp(12px,2.6vw,31px) clamp(10px,3vw,34px)
  }
  .concert-ticket .ticket .kicker{font-size:clamp(.48rem,.9vw,.7rem)}
  .concert-ticket .ticket h2{
    font:normal clamp(1.1rem,3.4vw,2.5rem)/1.1 Georgia,serif;
    margin:7px 0 10px
  }
  .concert-ticket .ticket-grid{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(7px,1.5vw,17px);
    border-top:2px dashed #c1a77d;margin:10px 0 0;padding-top:10px
  }
  .concert-ticket .ticket-grid[hidden]{display:none}
  .concert-ticket .ticket-item dt{font-size:clamp(.48rem,.8vw,.6rem)}
  .concert-ticket .ticket-item dd{font-size:clamp(.66rem,1.2vw,.95rem)}
  .concert-ticket .concert-subtitle{font-size:clamp(.7rem,1.2vw,.92rem);margin:4px 0 8px;overflow-wrap:anywhere}
  .concert-ticket .concert-subtitle[hidden]{display:none!important}
  .concert-ticket .ticket-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  @media(max-width:620px){.concert-ticket .ticket-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .concert-ticket .event-image-wrap img{max-height:170px;object-fit:contain}
  .concert-ticket #closingDetails{
    grid-column:2;grid-row:2;min-width:0;align-self:end;
    text-align:left;padding:10px clamp(8px,2vw,20px) clamp(13px,2vw,22px);
    overflow-wrap:anywhere
  }
  .concert-ticket #closingDetails .message{
    color:#f4e4ce;font:italic clamp(.68rem,1.1vw,.87rem)/1.42 Georgia,serif
  }
  .concert-ticket #closingDetails .label{font-size:clamp(.48rem,.8vw,.61rem)}
  .concert-ticket .booking-row{margin-top:12px;padding-top:10px}
  .concert-ticket .booking-row dd{word-break:break-word}
  .concert-ticket .ticket-underlay{background-size:cover;background-position:center}
  .concert-ticket[data-concert-theme="classic"] .ticket-underlay{background-image:url('/concert-reveal-art/classic.svg')}
  .concert-ticket[data-concert-theme="concert-lights"] .ticket-underlay{background-image:url('/concert-reveal-art/concert-lights.svg')}
  .concert-ticket[data-concert-theme="festival"] .ticket-underlay{background-image:url('/concert-reveal-art/festival.svg')}
  .concert-ticket[data-concert-theme="backstage"] .ticket-underlay{background-image:url('/concert-reveal-art/backstage.svg')}
  .concert-ticket .ticket-identity,.concert-ticket #closingDetails{background:rgba(13,12,28,.35)}
  .concert-ticket .ticket{background:rgba(255,249,234,.91);backdrop-filter:blur(2px)}
  .concert-ticket[data-concert-theme="concert-lights"] .ticket,
  .concert-ticket[data-concert-theme="backstage"] .ticket{
    background:rgba(13,13,34,.86);color:#fff0e5
  }
  .concert-ticket[data-concert-theme="concert-lights"] .ticket .kicker,
  .concert-ticket[data-concert-theme="concert-lights"] .ticket-item dt,
  .concert-ticket[data-concert-theme="backstage"] .ticket .kicker,
  .concert-ticket[data-concert-theme="backstage"] .ticket-item dt{color:#f0c58d}
  .concert-ticket[data-concert-theme="concert-lights"] .booking-row a,
  .concert-ticket[data-concert-theme="backstage"] .booking-row a{color:#f2d39f}
  .concert-ticket .qr-row{display:flex;justify-content:center;margin-top:12px;min-height:126px;align-items:center}
  .concert-ticket .qr-row svg{width:min(120px,100%);height:auto;background:white;padding:7px;border-radius:9px}
  .concert-ticket .qr-row[hidden]{display:none!important}
  @media(max-width:620px){
    .card.concert-ticket{min-height:180px;border-width:2px}
    .concert-ticket .ticket-underlay{min-height:180px}
    .concert-ticket .ticket-identity{padding:12px 8px 6px}
    .concert-ticket #closingDetails{padding:8px 8px 13px}
    .concert-ticket .ticket{padding:12px 10px}
    .concert-ticket .ticket-grid{grid-template-columns:1fr 1fr;gap:8px}
    .concert-ticket .ticket-grid dd{font-size:.7rem;overflow-wrap:anywhere}
  }
  @media(max-width:370px){
    .concert-ticket .ticket-grid{grid-template-columns:1fr}
  }

  /* Concert reveal mirrors the exact landscape template. Extra prose is
     outside the fixed ticket so the scratch mask never becomes a tall poster. */
  .card.concert-ticket{
    display:block;width:100%;height:auto;aspect-ratio:2.15/1;
    min-height:0;max-height:none;overflow:hidden;border-radius:10px
  }
  .card.concert-ticket .ticket-underlay{
    position:absolute;inset:0;width:100%;height:100%;min-height:0;
    display:grid;grid-template-columns:minmax(0,77%) minmax(0,23%);
    grid-template-rows:minmax(0,1fr);padding:0;gap:0;overflow:hidden
  }
  .card.concert-ticket .ticket{
    grid-column:1;grid-row:1;width:100%;height:100%;min-height:0;
    padding:clamp(7px,1.9vw,19px);overflow:hidden;border-radius:0;
    box-shadow:none
  }
  .card.concert-ticket .ticket-identity{
    grid-column:2;grid-row:1;min-height:0;padding:clamp(5px,1.2vw,14px);
    border-left:2px dashed #f1d293bf;background:rgba(13,12,27,.86);
    display:flex;flex-direction:column;align-items:stretch;text-align:center;
    gap:clamp(3px,.9vw,9px);overflow:hidden
  }
  .card.concert-ticket::after{display:none}
  .card.concert-ticket .recipient{
    font:700 clamp(.65rem,1.6vw,1.18rem)/1.1 system-ui,sans-serif;
    margin:0;overflow-wrap:anywhere
  }
  .card.concert-ticket .ticket .kicker{
    font-size:clamp(.42rem,.72vw,.61rem);line-height:1.15
  }
  .card.concert-ticket .ticket h2{
    font:700 clamp(.78rem,2.5vw,2rem)/1.05 Georgia,serif;
    margin:4px 0 6px
  }
  .card.concert-ticket .concert-subtitle{
    font-size:clamp(.48rem,.98vw,.8rem);margin:2px 0 5px;line-height:1.24
  }
  .card.concert-ticket .ticket-grid{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:clamp(4px,.8vw,9px);margin:clamp(5px,1vw,12px) 0 0;
    padding:0;border:0
  }
  .card.concert-ticket .ticket-grid .ticket-item{
    border:1px solid #a78d69a9;padding:clamp(3px,.65vw,8px);border-radius:3px;
    min-width:0
  }
  .card.concert-ticket .ticket-item dt{
    font-size:clamp(.39rem,.65vw,.56rem);line-height:1.1;letter-spacing:.06em;
    margin:0 0 3px
  }
  .card.concert-ticket .ticket-item dd{
    font-size:clamp(.51rem,1vw,.85rem);line-height:1.17;font-weight:750
  }
  .card.concert-ticket .event-image-wrap{
    float:right;width:26%;max-height:clamp(40px,12vw,125px);
    margin:3px 0 5px 10px;border-radius:5px;overflow:hidden
  }
  .card.concert-ticket .event-image-wrap img{
    width:100%;max-height:clamp(40px,12vw,125px);object-fit:contain;
    border-radius:4px
  }
  .card.concert-ticket .concert-stub-fields{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:clamp(3px,.5vw,7px);margin:3px 0;padding:0
  }
  .card.concert-ticket .concert-stub-fields .ticket-item{
    min-width:0;border:1px solid #f4d79d9c;border-radius:3px;
    padding:clamp(2px,.4vw,6px)
  }
  .card.concert-ticket .concert-stub-fields dt{
    color:#f1d293;font-size:clamp(.37rem,.6vw,.56rem);letter-spacing:.04em;
    margin:0
  }
  .card.concert-ticket .concert-stub-fields dd{
    color:#fff5df;font-size:clamp(.49rem,.83vw,.75rem);
    line-height:1.15;overflow-wrap:anywhere
  }
  .card.concert-ticket .booking-row{
    margin:auto 0 0;padding:3px 0;border:0;text-align:center
  }
  .card.concert-ticket .booking-row dt{
    color:#f4d99e;font-size:clamp(.35rem,.65vw,.55rem)
  }
  .card.concert-ticket .booking-row dd{
    font-size:clamp(.44rem,.75vw,.65rem);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis
  }
  .card.concert-ticket .booking-row a{color:#f8dfad}
  .card.concert-ticket .qr-row{
    min-height:0;margin:auto 0 0;display:flex;justify-content:center;
    align-items:center;overflow:hidden
  }
  .card.concert-ticket .qr-row svg{
    width:min(92%,116px);max-height:clamp(42px,12vw,115px);
    height:auto;background:#fff;padding:4px;border-radius:5px
  }
  .concert-after-card{
    margin:14px auto 0;text-align:center;max-width:760px;
    padding:14px 18px;border:1px solid #f3d28c75;border-radius:12px;
    background:#221d32;color:#f9e1bf
  }
  .concert-after-card .message{color:#f4ddc1}
  .concert-after-card[hidden]{display:none!important}
  @media(max-width:620px){
    .card.concert-ticket{min-height:0;height:auto;aspect-ratio:2.15/1}
    .card.concert-ticket .ticket-underlay{
      min-height:0;height:100%;grid-template-columns:minmax(0,77%) minmax(0,23%)
    }
    .card.concert-ticket .ticket{padding:4px 5px}
    .card.concert-ticket .ticket-identity{padding:4px 3px;gap:2px}
    .card.concert-ticket .ticket h2{font-size:clamp(.7rem,3vw,1.1rem);margin:3px 0}
    .card.concert-ticket .concert-subtitle{font-size:.45rem;margin:1px 0}
    .card.concert-ticket .ticket-grid{gap:3px;margin-top:3px}
    .card.concert-ticket .ticket-grid .ticket-item{padding:2px}
    .card.concert-ticket .ticket-item dt,.card.concert-ticket .concert-stub-fields dt{font-size:.36rem}
    .card.concert-ticket .ticket-item dd,.card.concert-ticket .concert-stub-fields dd{font-size:.48rem}
    .card.concert-ticket .concert-stub-fields{gap:2px}
    .card.concert-ticket .recipient{font-size:.65rem}
    .card.concert-ticket .qr-row svg{max-height:58px}
    .card.concert-ticket .event-image-wrap,.card.concert-ticket .event-image-wrap img{max-height:57px}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<main>
  <div class="eyebrow">Something special just for you</div>
  <h1 id="title">Your surprise awaits</h1>
  <p class="intro" id="intro">Preparing your personal scratch card…</p>
  <div id="error" class="error" hidden role="alert"></div>
  <div id="card" class="card" hidden>
    
    <canvas id="foilCanvas" aria-label="Scratch to uncover your surprise"></canvas>
  </div>
  <p class="status" id="status" aria-live="polite"></p>
  <progress id="progress" value="0" max="100" aria-label="Scratch progress" hidden></progress>
  <button id="concertFullTicketButton" type="button" hidden>View full-size ticket</button>
  <a id="bookingAction" rel="noopener noreferrer nofollow" referrerpolicy="no-referrer"
    target="_blank" hidden>Open your booking link</a>
  <div id="controls" class="buttons" hidden>
    <button id="soundButton" type="button" aria-pressed="true">♫ Sound on</button>
    <button id="replayButton" type="button">↻ Scratch again</button>
  </div>
  <footer id="footer"></footer>
</main>
<dialog id="concertFullTicketDialog" aria-label="Enlarged concert ticket">
  <div id="concertFullTicketScroll" class="concert-full-ticket-scroll"></div>
  <button id="concertCloseZoom" type="button">Close</button>
</dialog>
<script type="module">
  import { ScratchCard } from '/scratchcard.js?v=concert-professional-8';
  import {mountScratchFace,fillScratchFace,setPortraitFaceTheme,setScratchFaceImage} from '/scratch-recipient-face.js?v=actual-1';
  import {DEFAULT_CONCERT_TEMPLATE,DEFAULT_CONCERT_REVEAL_THEME,isConcertTemplate,isConcertRevealTheme,concertTicketClipPath,concertTemplateLayout} from '/concert-ticket-options.js?v=2';
  import {renderConcertReference} from '/concert-reference-renderer.js?v=reference-6';
   import {getScratchArtwork} from '/scratch-artwork-catalogue.js?v=final-20-1';
    import {applyScratchTheme,getScratchTheme,DEFAULT_SCRATCH_THEME} from '/scratch-themes.js?v=themes-13-1';
  import { ScratchCinematicAudio } from '/scratch-audio.js?v=first-scratch-v1';
  import { recipientCardModel } from '/scratch-recipient-fields.js?v=complete-card-1';
   import {displayConcertTicketRows,cleanConcertTicketDetails} from '/concert-ticket-fields.js?v=2';
  const $ = id => document.getElementById(id);
  mountScratchFace($('card'));
  const slug = location.pathname.split('/').filter(Boolean)[1];
  const status = $('status');
  let scratch = null;
  let cinematic = null;
  let soundEnabled = true;
  const text = (id,value) => { $(id).textContent = value ?? ''; };
  let bookingLink = '';
  function applyConcertTicketFields(raw) {
    const details=cleanConcertTicketDetails(raw);
    text('concertEventSubtitle',details.eventSubtitle||'');
    $('concertEventSubtitle').hidden=!details.eventSubtitle;
    for(const old of $('ticketGrid').querySelectorAll('.concert-extra-row'))old.remove();
    $('concertStubFields').replaceChildren();
    for(const field of displayConcertTicketRows(details)){
      if(field.id==='eventSubtitle')continue;
      const stub=['section','row','seat','gate'].includes(field.id);
      const row=document.createElement('div');row.className='ticket-item concert-extra-row';
      row.dataset.concertField=field.id;
      const dt=document.createElement('dt');dt.textContent=field.label;
      const dd=document.createElement('dd');dd.textContent=field.value;
      row.append(dt,dd);
      (stub ? $('concertStubFields') : $('ticketGrid')).append(row);
    }
    if($('ticketGrid').querySelector('.concert-extra-row'))$('ticketGrid').hidden=false;
  }
  async function load() {
    if (!slug || !/^[A-Za-z0-9_-]+$/.test(slug)) throw new Error('Invalid reveal link.');
    const response = await fetch('/r/' + encodeURIComponent(slug) + '/scratch-data', {cache:'no-store'});
    if (!response.ok) throw new Error('This surprise is not yet available.');
    const data = await response.json();
    if (!data.success) throw new Error('This surprise is not available.');
    const model = recipientCardModel(data.reveal);
    const chosenTheme = data.scratchSurface.theme || DEFAULT_SCRATCH_THEME;
    const artwork = getScratchArtwork(data.scratchSurface.artworkId);
    const isConcert = data.scratchSurface.variant === 'concert';
    const visualTheme = (artwork || isConcert) ? null : applyScratchTheme(document,chosenTheme,'recipient');
    soundEnabled = data.audio?.enabled !== false;
    document.body.dataset.ticketVariant = isConcert ? 'concert' : 'ticket';
    $('card').classList.toggle('concert-ticket',isConcert);
    if(isConcert){
      const shape=isConcertTemplate(data.scratchSurface.ticketTemplate)
        ? data.scratchSurface.ticketTemplate : DEFAULT_CONCERT_TEMPLATE;
      const revealTheme=isConcertRevealTheme(data.scratchSurface.revealTheme)
        ? data.scratchSurface.revealTheme : DEFAULT_CONCERT_REVEAL_THEME;
      $('card').dataset.concertTheme=revealTheme;
      $('card').dataset.concertTemplate=shape;
      $('card').dataset.concertLayout=concertTemplateLayout(shape);
      $('card').dataset.hasImage=model.hasEventImage?'true':'false';
      $('card').style.clipPath=concertTicketClipPath(shape);
    }
    if(isConcert) $('card').style.borderColor =
      {gold:'#d3a752',silver:'#d2dce7',midnight:'#6079d4',rose:'#d69cac'}[data.scratchSurface.foil] || '#d3a752';
    document.querySelector('.eyebrow').textContent = isConcert ? 'Concert ticket' : (artwork ? 'A special scratch reveal' : visualTheme.icon+' '+visualTheme.label+' reveal');
    text('title','A surprise for ' + model.recipient);
    text('name',model.recipient);
    text('eventName',model.eventName);
    text('headline', data.scratchSurface.variant === 'concert' ? 'The big night awaits!' : 'Your special surprise');
    text('ticketKicker', data.scratchSurface.variant === 'concert' ? 'LIVE IN CONCERT' : 'PERSONALISED EVENT TICKET');
    fillScratchFace(document,model,{concert:isConcert});
    if(!isConcert&&!artwork)setPortraitFaceTheme($('card'),chosenTheme);
    bookingLink=model.ticketUrl;
    if(bookingLink)$('bookingAction').href=bookingLink;
    else $('bookingAction').removeAttribute('href');
    if(isConcert){
      applyConcertTicketFields(data.scratchSurface.ticketDetails);
      const admit=model.details.find(d=>d.id==='admit');
      $('admitRow').hidden=true;
      $('name').textContent=admit?.value || model.recipient;
      $('concertStubHeading').textContent='ADMIT';
      // Keep the link inside the stub and personal message beneath the
      // fixed-size ticket; neither should enlarge the scratchable Canvas.
      $('card').after($('closingDetails'));
      $('closingDetails').classList.add('concert-after-card');
      $('closingDetails').style.visibility='hidden';
      $('card').querySelector('.ticket-identity').append($('bookingRow'));
    }
    await setScratchFaceImage(document,model.hasEventImage ? '/r/' + encodeURIComponent(slug) + '/scratch-image' : '');
    if(isConcert){
      const extra=cleanConcertTicketDetails(data.scratchSurface.ticketDetails);
      renderConcertReference($('card'),{
        preset:data.scratchSurface.ticketTemplate,eventTitle:model.eventName,
        subtitle:extra.eventSubtitle,recipient:model.recipient,
        admit:model.details.find(x=>x.id==='admit')?.value,
        date:data.reveal.eventDate,time:data.reveal.eventTime,
        venue:data.reveal.venue,venueAddress:extra.venueAddress,
        section:extra.section,row:extra.row,seat:extra.seat,gate:extra.gate,level:extra.level,
        officialLink:model.ticketUrl,imageSrc: model.hasEventImage ? $('eventImage').src : ''
      });
    }
    $('intro').textContent = 'Scratch the surface with your finger or mouse. Every piece of foil stays until you remove it.';
    $('card').hidden = false;

    cinematic = new ScratchCinematicAudio({
      enabled:soundEnabled,
      delayMs:3000,
      onCue:() => { status.textContent = 'The cinematic drum roll has begun. Keep scratching!'; }
    });
    scratch = new ScratchCard({
      canvas:$('foilCanvas'),
      foil:data.scratchSurface.foil,
      concertTicket:isConcert,
      ticketTemplate:isConcert ? data.scratchSurface.ticketTemplate || DEFAULT_CONCERT_TEMPLATE : DEFAULT_CONCERT_TEMPLATE,
      theme:chosenTheme,
      coverStyle:isConcert ? 'concert' : data.scratchSurface.style === 'custom' ? 'classic' : data.scratchSurface.style,
      brushSize:49,
      onScratch:() => cinematic.onFirstScratch(),
      onProgress:p => {
        $('progress').value = Math.round(p*100);
        // The link is also available below the finished card once the user
        // has substantially scratched it; Canvas overlays otherwise block taps.
        if (bookingLink && p >= 0.7) $('bookingAction').hidden = false;
        if(isConcert && p>=0.7){
          $('closingDetails').style.visibility='visible';
          $('concertFullTicketButton').hidden=false;
        }
      },
      onComplete:() => { status.textContent = 'You uncovered your surprise!'; }
    });

    scratch.artworkId = artwork?.id || null;
    if (isConcert) {
      // Never cover the chosen colour with old theme artwork or uploads.
    } else if (artwork && !data.scratchSurface.hasImage) {
      const applied = await scratch.setCoverImage(artwork.src);
      if (!applied) throw new Error('The selected scratch artwork could not be opened.');
    } else if (data.scratchSurface.hasImage) {
      const applied = await scratch.setCoverImage('/r/' + encodeURIComponent(slug) + '/scratch-cover');
      if (!applied) throw new Error('Your custom scratch image could not be loaded.');
    }
    $('card').classList.add('foil-ready');
    $('progress').hidden = false;
    $('controls').hidden = false;
    $('soundButton').hidden = !soundEnabled;
    status.textContent = 'Scratch the card to discover your surprise.';
  }

  $('concertFullTicketButton').addEventListener('click',()=>{
    // This action appears only after paid recipient has physically uncovered
    // most of the foil. The enlarged version is a read-only ticket, no canvas.
    if(!scratch || $('concertFullTicketButton').hidden)return;
    const original=$('card');
    const copy=document.createElement('div');
    copy.className='card concert-ticket foil-ready';
    copy.dataset.concertTemplate=original.dataset.concertTemplate;
    copy.dataset.concertLayout=original.dataset.concertLayout;
    copy.dataset.referenceLayout=original.dataset.referenceLayout;
    copy.dataset.hasImage=original.dataset.hasImage;
    copy.dataset.concertTheme=original.dataset.concertTheme;
    copy.style.clipPath=original.style.clipPath;
    const print=$('underlay').cloneNode(true);
    print.removeAttribute('id');
    for(const item of print.querySelectorAll('[id]')){
      if(!item.closest('.ct-reference-art'))item.removeAttribute('id');
    }
    print.style.visibility='visible';
    copy.append(print);
    // The modal displays a 850px print-scale ticket even on a 390px phone.
    // Apply print-size typography directly to the CLONE because the layout
    // viewport stays mobile and responsive rules would otherwise keep
    // thumbnail-sized letters despite the enlarged ticket canvas.
    const zoomTitle=copy.querySelector('.ticket h2');
    if(zoomTitle)zoomTitle.style.setProperty('font-size','2.25rem','important');
    for(const node of copy.querySelectorAll('.ticket-item dd')){
      node.style.setProperty('font-size','.9rem','important');
    }
    $('concertFullTicketScroll').replaceChildren(copy);
    $('concertFullTicketDialog').showModal();
  });
  $('concertCloseZoom').addEventListener('click',()=>$('concertFullTicketDialog').close());
  $('concertFullTicketDialog').addEventListener('close',()=>$('concertFullTicketScroll').replaceChildren());
  $('replayButton').addEventListener('click',() => {
    if (!scratch) return;
    cinematic.reset();
    scratch.reset();
    $('bookingAction').hidden = true;
    if(document.body.dataset.ticketVariant==='concert')$('closingDetails').style.visibility='hidden';
    $('concertFullTicketButton').hidden=true;
    if($('concertFullTicketDialog').open)$('concertFullTicketDialog').close();
    $('concertFullTicketScroll').replaceChildren();
    status.textContent = 'Scratch to begin again.';
  });
  $('soundButton').addEventListener('click',() => {
    if (!cinematic) return;
    soundEnabled = !soundEnabled;
    cinematic.setEnabled(soundEnabled);
    $('soundButton').setAttribute('aria-pressed',String(soundEnabled));
    $('soundButton').textContent = soundEnabled ? '♫ Sound on' : '♫ Sound off';
  });
  window.addEventListener('pagehide', () => {
    scratch?.destroy();
    cinematic?.destroy();
  });
  load().catch(error => {
    $('card').hidden = true;
    $('controls').hidden = true;
    $('progress').hidden = true;
    $('bookingAction').hidden = true;
    $('intro').textContent = 'We could not open this surprise.';
    $('error').hidden = false;
    $('error').textContent = error.message || 'Please try again later.';
  });
</script>
</body>
</html>
