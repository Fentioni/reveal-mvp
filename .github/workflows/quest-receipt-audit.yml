name: One-time Quest Stripe TEST receipt audit
on:
  push:
    branches: [feature/stage4b-cloudflare-staging]
    paths: ['.github/workflows/quest-receipt-audit.yml']
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Quest staging D1 paid status and Stripe event only (no customer data)
        run: |
          node --input-type=module <<'EOF'
          const url='https://reveal-stage4b-test.michael-fenton9.workers.dev/api/quest/test-receipt-check-7e5c';
          let data;
          for(let i=0;i<36;i++){
            try{
              const response=await fetch(url,{headers:{'x-quest-receipt-audit':'K9qW28Nb5tD76GzM4cE3YpL11QXr0fV'},cache:'no-store',signal:AbortSignal.timeout(10000)});
              if(response.ok){data=await response.json();break;}
            }catch{}
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(!data)throw Error('Temporary receipt check not deployed');
          const status={
            staging:data.environment==='staging',revealPaid:data.revealPaid===true,
            paymentPaid:data.paymentPaid===true,webhookEventRecorded:data.webhookEventRecorded===true,
            questConfigured:data.questConfigured===true
          };
          console.log('QUEST STRIPE REAL TEST ACCEPTANCE:',JSON.stringify(status));
          if(Object.values(status).some(x=>!x))throw Error('A staging payment receipt or webhook gate did not pass');
          EOF
