name: Reveal Quest tests
on:
  pull_request:
    paths:
      - 'src/**'
      - 'quest.js'
      - 'quest.html'
      - 'quest-assets/**'
      - 'sql/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/quest-tests.yml'
  push:
    branches:
      - feature/reveal-quest-travel-adventure
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  mobile-browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0
      - run: npm run test:browser
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quest-mobile-chapter-screenshots
          path: test-output/*.png
          if-no-files-found: ignore
          retention-days: 7
