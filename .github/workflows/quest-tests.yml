name: Reveal Quest tests
on:
  pull_request:
    paths:
      - 'src/**'
      - 'quest.js'
      - 'quest.html'
      - 'sql/**'
      - 'tests/**'
      - 'package.json'
  push:
    branches:
      - feature/reveal-quest-travel-adventure
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
