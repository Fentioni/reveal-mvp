name: Scratch template integration
on:
  push:
    branches:
      - feature/scratch-template-integration
      - feature/stage4b-cloudflare-staging
      - fix/scratch-browser-integration
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/post-scratch.browser.mjs
      - run: node --test tests/scratch-themes.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scratch-template-browser-checks
          path: test-output/post-scratch
