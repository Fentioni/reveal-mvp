name: One-time Quest staging secret presence audit
on:
  push:
    branches: [feature/stage4b-cloudflare-staging]
    paths: ['.github/workflows/quest-readiness-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read Boolean-only staging payment readiness (never secret values)
        run: |
          node --input-type=module <<'EOF'
          const url='https://reveal-stage4b-test.michael-fenton9.workers.dev/api/quest/audit-activation-c3f9';
          let checks=null;
          for(let i=0;i<28;i++){
            try{
              const response=await fetch(url,{headers:{'x-quest-staging-audit':'V9q4aC2mt17y8HErN6dvW3Qb5Lzp0jsf'},cache:'no-store',signal:AbortSignal.timeout(10000)});
              if(response.status===200){checks=await response.json();break;}
            }catch{}
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(!checks)throw Error('Staging diagnostic not yet available in Cloudflare');
          const allowed=['stagingWorker','testMode','enabledFlag','databaseBound','imageStorageBound','priceVerified','keyPresent','keyTestFormat','webhookPresent','webhookFormat','ready'];
          const result=Object.fromEntries(allowed.map(key=>[key,checks[key]===true]));
          console.log('QUEST STAGING PAYMENT READINESS (booleans only): '+JSON.stringify(result));
          if(!result.stagingWorker||!result.testMode||!result.databaseBound||!result.priceVerified)throw Error('Staging safety isolation failed.');
          EOF
