name: Safari live staging upload verification
on:
  push:
    branches: [feature/stage4b-cloudflare-staging]
    paths:
      - public/legacy-create.html
      - tools/verify-safari-upload-live.mjs
      - .github/workflows/safari-live-upload.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit-live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0
      - run: node tools/verify-safari-upload-live.mjs
