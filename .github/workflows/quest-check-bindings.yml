name: One-time Stripe binding audit in staging
on:
  push:
    branches: [feature/stage4b-cloudflare-staging]
    paths:
      - '.github/workflows/quest-check-bindings.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare Worker binding presence, never print secret values
        run: |
          node --input-type=module <<'EOF'
          const url='https://reveal-stage4b-test.michael-fenton9.workers.dev/api/quest/config-audit-b2f41';
          const header='U7X69jw8SzPYxT5NB4kw9VHrmFeQ2a';
          for(let i=0;i<12;i++){
            const response=await fetch(url,{headers:{'x-quest-audit':header},cache:'no-store'});
            if(response.ok){
              const data=await response.json();
              if(data.staging!==true)throw Error('Not a staging response');
              console.log('NON-SECRET STRIPE CONFIG AUDIT',JSON.stringify(data));
              process.exit(0);
            }
            await new Promise(done=>setTimeout(done,5000));
          }
          console.error('New staging diagnostic did not reach Cloudflare after retries');
          process.exit(1);
          EOF
