name: Scratch Ticket live staging verification
on:
  push:
    branches: [feature/scratch-template-integration]
    paths: ['tools/verify-scratch-live.mjs', '.github/workflows/scratch-live-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - run: node tools/verify-scratch-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scratch-live-staging-screenshots
          path: test-output/scratch-live/
