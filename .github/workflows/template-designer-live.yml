name: Template Studio live staging
on:
  push:
    branches: [feature/stage4b-cloudflare-staging]
    paths: ['public/admin-template-designer.*', 'public/published-template-designs.js', 'public/template-design-schema.js', 'src/template-designs.js', 'src/index.js', 'tools/verify-template-designer-live.mjs', '.github/workflows/template-designer-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - run: node tools/verify-template-designer-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-template-studio-screenshots
          path: test-output/template-designer-live/
