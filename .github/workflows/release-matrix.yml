name: Stage 9 final browser and device release matrix
on:
  push:
    branches: [feature/stage4b-cloudflare-staging]
    paths: ['public/**','src/**','tools/verify-release-matrix.mjs','tests/scratch-themes.browser.mjs','.github/workflows/release-matrix.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0
      - run: node tools/verify-release-matrix.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage9-device-screenshots
          path: test-output/release-matrix/
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0
      - run: SCRATCH_BROWSER=firefox node --test --test-name-pattern='paid Scratch Ticket export|paid purchaser can copy|Scratch Ticket header spans' tests/scratch-themes.browser.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage9-firefox-keepsakes
          path: test-output/scratch-firefox/
