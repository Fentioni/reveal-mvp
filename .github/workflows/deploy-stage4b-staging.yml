name: Verify Reveal Stage 4B staging
on:
  workflow_dispatch:
  push:
    branches: [feature/stage4b-cloudflare-staging]
    paths:
      - 'public/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/deploy-stage4b-staging.yml'
permissions:
  contents: read
concurrency:
  group: reveal-stage4b-staging
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Cloudflare Workers Builds deploys this branch directly to reveal-stage4b-test.
    # GitHub Actions verifies only; no duplicate deploy or Cloudflare secrets.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify application
        run: npm test
      - name: Verify Cloudflare Worker build
        run: npx --yes wrangler deploy --dry-run --outdir /tmp/reveal-stage4b-worker
      - name: Confirm staging target configuration
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); if(c.name!=='reveal-stage4b-test'||c.vars?.STAGING_DISABLE_CHECKOUT!=='true') process.exit(1); console.log('Staging-only target verified; deployment is managed by Cloudflare Workers Builds.')"
