name: Deploy Reveal Stage 4B staging
on:
  workflow_dispatch:
  push:
    branches: [feature/stage4b-cloudflare-staging]
    paths:
      - 'public/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/deploy-stage4b-staging.yml'
permissions:
  contents: read
concurrency:
  group: reveal-stage4b-staging
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify application
        run: npm test
      - name: Verify Cloudflare Worker build
        run: npx --yes wrangler deploy --dry-run --outdir /tmp/reveal-stage4b-worker
      - name: Validate staging deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret. Staging cannot be deployed automatically."
            exit 1
          fi
      - name: Deploy to staging Worker (never production)
        run: npx --yes wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Confirm staging deployment
        run: |
          node -e "fetch('https://reveal-stage4b-test.michael-fenton9.workers.dev/admin-template-designer',{cache:'no-store'}).then(async r=>{if(!r.ok||!(await r.text()).includes('photoOrientation'))process.exit(1);console.log('Staging designer verified')}).catch(e=>{console.error(e);process.exit(1)})"
